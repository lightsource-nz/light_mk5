source [find interface/cmsis-dap.cfg]
adapter speed 5000

#   CORE 0 ONLY by default, which is not rp2040.cfg's default (USE_CORE SMP -- both cores in an
# hwthread RTOS group). See openocd-rp2350.cfg for the full reasoning and measurements; it
# applies identically, since both chips run the same shell and the same core 1 log drain.
#
#   TO INSPECT CORE 1 (rp2040.cfg names them core0/core1, not cm0/cm1):
#
#     openocd -c "set USE_CORE SMP" -f openocd-rp2040.cfg
#
#   expect the firmware to stall when you do; that is the reason for the default.
if { ![info exists USE_CORE] } {
        set USE_CORE 0
}
source [find target/rp2040.cfg]

# A RESET IS A WHOLE-CHIP REBOOT: the watchdog resets everything but core 0 just before the
# stock SYSRESETREQ takes core 0. See openocd-rp2350.cfg for why (a core-0-only reset leaves
# core 1 running the old image under the new boot); this chip's registers are PSM at
# 0x40010000 (WDSEL: everything but the oscillators and PROC0) and WATCHDOG at 0x40058000.
foreach t [target names] {
        $t configure -event reset-assert-pre {
                mww 0x40010008 0x00017ffc
                catch { mww 0x40058000 0x80000000 }
        }
}

# RESUME WHEN GDB DETACHES. This OpenOCD's gdb-detach event does nothing by default, so a
# board a script attached to for a look -- debug.ps1 -Attach -Batch -Ex 'x/...' -- is left
# HALTED when gdb exits and OpenOCD is stopped: no debugger, no console, a dead-looking board.
# On a USB-console board this looked exactly like a wedged device stack (the host's next
# control request timed out) and cost an afternoon. Interactive sessions end with the board
# running too, which is what everyone expects of "detach".
foreach t [target names] {
        $t configure -event gdb-detach {
                if {[[target current] curstate] eq "halted"} {
                        resume
                }
        }
}
