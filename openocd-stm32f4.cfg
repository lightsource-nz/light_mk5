# STM32F411 (blackpill) over an ST-Link: the same shape as the H7 config
source [find interface/stlink.cfg]
transport select swd

source [find target/stm32f4x.cfg]

# RESUME WHEN GDB DETACHES. This OpenOCD's gdb-detach event does nothing by default, so a
# board a script attached to for a look -- debug.ps1 -Attach -Batch -Ex 'x/...' -- is left
# HALTED when gdb exits and OpenOCD is stopped: no debugger, no console, a dead-looking board.
# On a USB-console board this looked exactly like a wedged device stack (the host's next
# control request timed out) and cost an afternoon. Interactive sessions end with the board
# running too, which is what everyone expects of "detach".
foreach t [target names] {
        $t configure -event gdb-detach {
                if {[[target current] curstate] eq "halted"} {
                        resume
                }
        }
}
