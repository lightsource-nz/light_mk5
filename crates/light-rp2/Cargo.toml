[package]
workspace = "../../firmware"
name = "light-rp2"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RP2-family board access for the light framework via the chip's pac: the RP2040 (Cortex-M0+) and the RP2350 (Cortex-M33 or Hazard3)"

[features]
#   exactly one chip. The two pacs expose the same accessors for every block this crate
# touches (svd2rust of the same generation over near-identical SVDs), so the chip shows in
# three places: which pac is aliased as `pac`, the timer block's name, and the RP2350's
# pad isolation bit. Everything else is one source
rp2040 = ["dep:rp2040-pac", "cotton-usb-host?/rp2040"]
rp2350 = ["dep:rp235x-pac", "cotton-usb-host?/rp2350"]
#   the USB host role: the ecosystem's host stack over its controller driver for this chip
# (vendored under lib/ with the framework's fixes, see its LIGHT_PATCHES.md), behind
# light_midi::Host in src/usb_host.rs. A board whose native USB port hosts instruments carries
# it instead of usb-console; the C shell links no USB stack in either role
usb-host = ["dep:light-midi", "dep:cotton-usb-host", "dep:futures", "dep:defmt"]
#   the USB device role: the port's own controller driver (src/usb.rs) with the CDC console on
# it, run from the core-1 loop in src/shell.rs. Every board whose native USB port is a device
# carries it; a host-role board (usb-host) leaves it off and its console is the UART alone
usb-console = ["dep:usb-device", "dep:usbd-serial"]
#   the wireless part some boards of this family carry: the ecosystem's driver for it over a bus
# this crate builds out of PIO (src/wifi.rs), plus the clock facility that driver asks the
# application to supply. A board without the part leaves this off and links none of it
wifi = ["dep:cyw43", "dep:embassy-time-driver", "dep:embedded-hal-1", "dep:embassy-net-driver", "dep:embassy-net", "dep:log"]
#   the SAME part's short-range radio, which is a second image uploaded into it beside the first
# and a second driver handle out the other side -- a transport carrying the standard host-controller
# protocol, for a host stack to sit on. Additive to `wifi` rather than an alternative to it: one
# part, one bus, one power-up, and the vendor drop whose image carries both is what the build
# switches to when this is asked for (see LightRadio.cmake).
bluetooth = ["wifi", "cyw43/bluetooth", "dep:bt-hci"]

[dependencies]
light-core = { path = "../light-core" }
light-midi = { path = "../light-midi", optional = true }
cotton-usb-host = { path = "../../lib/cotton-usb-host", default-features = false, optional = true }
futures = { version = "0.3", default-features = false, optional = true }
defmt = { version = "1", optional = true }
#   no `rt` feature on either: the vector table, reset handler and linker script belong to
# pico-sdk's runtime in the C shell. This crate only wants the register definitions
rp235x-pac = { version = "0.2", default-features = false, optional = true }
rp2040-pac = { version = "0.6", default-features = false, optional = true }
#   the restore state is "was this the outermost section", one bool
critical-section = { version = "1.2", features = ["restore-state-bool"] }
#   the USB device stack above the port's controller driver (src/usb.rs): the device/endpoint
# model, and the CDC-ACM class the console rides on. Both no_std, no allocation
usb-device = { version = "0.3", optional = true }
usbd-serial = { version = "0.2", optional = true }
#   the wireless part's driver, its view of a network interface, and the clock facility it is
# written against -- a microsecond tick, which is what this chip's timer already counts for the
# framework's own log, so src/wifi.rs supplies it in four lines
#   with `log`, because a radio that refuses says so through its driver's logging and nowhere
# else: the failure that matters here is one command out of a conversation of hundreds answering
# with a status, and without the driver's own account of it there is nothing to go on. src/wifi.rs
# forwards it into the framework's log, so it arrives on the same console as everything else
#   0.7 AND NOT 0.5, and the reason is not this crate's: a host stack for the part's short-range
# radio and this driver must agree on the crate that defines the protocol between them, and they
# agree only from here on. So the version is pinned by something above rather than by anything
# wanted here -- which is why the upgrade was made and proven on its own, with the wireless path
# and an over-the-air update, before any stack was put on top of it.
cyw43 = { version = "0.7", default-features = false, features = ["log"], optional = true }
#   the host-controller protocol's own types, so a command is named rather than assembled out of
# opcodes. The same version the driver above speaks, and only pulled in with `bluetooth`
bt-hci = { version = "0.8", default-features = false, optional = true }
log = { version = "0.4", default-features = false, optional = true }
embassy-net-driver = { version = "0.2", optional = true }
#   the network over the radio: addresses, routing and connections, over the same smoltcp the
# rest of the embedded world uses. Only what a fetch needs is turned on -- one address family,
# one medium, connections and the means of being given an address
embassy-net = { version = "0.7", default-features = false, features = ["tcp", "dhcpv4", "medium-ethernet", "proto-ipv4"], optional = true }
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"], optional = true }
embedded-hal-1 = { package = "embedded-hal", version = "1.0", optional = true }
#   the Cortex-M0+ has no atomic read-modify-write instructions: portable-atomic's
# critical-section fallback provides swap/fetch_add there through THIS crate's spinlock
# section, and compiles to the native instructions everywhere else
portable-atomic = { version = "1", features = ["critical-section"] }

[target.'cfg(target_arch = "arm")'.dependencies]
#   PRIMASK for the critical section; no `critical-section-single-core` feature, because that
# implementation is wrong on a dual-core part -- see src/critical.rs. The Hazard3 build does
# the same with mstatus.MIE through inline asm and does not pull this crate in at all
cortex-m = "0.7"
