[package]
workspace = "../../../firmware"
#   light_app_ prefix: the plain name is the CMake EXECUTABLE (which must match the module
# directory), and CMake target names are one namespace with Corrosion's crate targets
name = "light_app_dictaphone_touch35"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the dictaphone on the Waveshare RP2350-Touch-LCD-3.5: the board wiring, embedded blobs and runtime over the light_dictaphone_core engine"

[lib]
crate-type = ["staticlib"]

[dependencies]
light_dictaphone_core = { path = "../../../crates/light_dictaphone_core" }
light-board-touch35 = { path = "../../../crates/light-board-touch35" }
light-core = { path = "../../../crates/light-core" }
light-draw = { path = "../../../crates/light-draw" }
light-display = { path = "../../../crates/light-display" }
light-input = { path = "../../../crates/light-input" }
light-ui = { path = "../../../crates/light-ui" }
light-audio = { path = "../../../crates/light-audio" }
light-rp2 = { path = "../../../crates/light-rp2", features = ["rp2350", "usb-console"] }
light-power-manager = { path = "../../../crates/light-power-manager" }
light-rtc = { path = "../../../crates/light-rtc" }
light-sd = { path = "../../../crates/light-sd" }
light-font = { path = "../../../crates/light-font" }
